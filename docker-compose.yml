version: '3.8'

services:
  fitai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitai-production-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=fitai_super_secret_jwt_production_key_2026
      - CLIENT_URL=http://localhost:5000
